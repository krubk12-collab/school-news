name: School News Digest

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 06:00 Asia/Bangkok (ให้ข่าวพร้อมก่อนเข้าเรียน 07:00-07:35)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Run digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python news_digest.py
      - name: Commit data
        run: |
          git config user.name "school-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "News digest $(date -u +%F)"
          git push
